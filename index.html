<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Booleaner</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

    </header>
    <!--/intestazione-->
    <main>
        <!--Titolo e sottotitolo-->
        <section class="title">
            <h1>Internet deve essere al servizio del "bene pubblico": il manifesto di Tim Berners-Lee</h1>

                <br>

            </p>

        <!--/titolo e sottotitolo-->

        <!-- Sezione foto di Tim Berners-Lee-->
        <section>
            <img src="./img/tim-1.jpg" alt="Tim Berners-Lee">
            <img src="./img/tim-2.jpg" alt="Tim Berners-Lee">
            <p class="imgdescription">1st Photo: John S. and James L. Knight Foundation, by Scott Henrichsen</p>
            <p class="imgdescription">2nd Photo: Wikimedia, by Paul Clarke</p>
        </section>
        <!--/Sezione foto di Tim Berners-Lee-->


    </main>
    <footer></footer>
